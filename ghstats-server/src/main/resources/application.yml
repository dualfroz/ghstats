server:
  port: 14330
  compression:
    enabled: true
    mime-types: image/svg+xml,application/json,text/plain
    min-response-size: 512
  shutdown: graceful

spring:
  main:
    banner-mode: off
  application:
    name: ghstats-server

logging:
  level:
    root: INFO
    com.dualfroz.ghstats: INFO

ghstats:
  server:
    snapshotPath: /srv/ghstats/data/snapshot.json
    pollIntervalSeconds: 30
    rateLimitPerMinute: 60
    cacheMaxAgeSeconds: 1800
    defaultTheme: tokyonight
    lanyardUserId: "000000000000000000"
    lanyardPollSeconds: 30
    discordCacheMaxAgeSeconds: 25
    discordBio: "Building things I don't know how to build yet."
    discordPronouns: "Strange(r)"
    discordBanner: "https://cdn.discordapp.com/banners/000000000000000000/06aacf47ba5d24b864e014407ee28661.png?size=480"
    discordBadges:
      - nitro
      - boost
      - quest
      - orb
      - legacy
