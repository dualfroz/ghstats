server {
    listen 80;
    listen [::]:80;
    server_name ghapi.dualfroz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ghapi.dualfroz.com;

    ssl_certificate /etc/letsencrypt/live/ghapi.dualfroz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghapi.dualfroz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ghapi.dualfroz.com.access.log;
    error_log /var/log/nginx/ghapi.dualfroz.com.error.log;

    root /opt/projects/dualfroz/ghstats/public;
    client_max_body_size 1m;

    gzip on;
    gzip_types image/svg+xml application/json text/plain;
    gzip_min_length 512;

    location = /v2/discord/interactions {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param GHAPI_CONFIG /etc/ghapi/config.json;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 10s;
    }

    location / {
        limit_req zone=ghapi burst=60 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param GHAPI_CONFIG /etc/ghapi/config.json;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 15s;
    }

    location = /healthz {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param GHAPI_CONFIG /etc/ghapi/config.json;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
