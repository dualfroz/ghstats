# /etc/nginx/sites-available/ghapi.dualfroz.com
# Reverse proxy for the ghstats server published on 127.0.0.1:14332.
#
# First issue: the subdomain already resolves to the VPS (wildcard), so a
# plain HTTP-01 challenge works:
#   sudo certbot --nginx -d ghapi.dualfroz.com
# certbot rewrites the listen 443 block and manages the ssl_certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name ghapi.dualfroz.com;

    # Let certbot serve the ACME challenge, redirect everything else to https.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ghapi.dualfroz.com;

    # Managed by certbot after the first issuance:
    # ssl_certificate     /etc/letsencrypt/live/ghapi.dualfroz.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ghapi.dualfroz.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types image/svg+xml application/json text/plain;
    gzip_min_length 512;
    gzip_proxied any;

    location / {
        proxy_pass http://127.0.0.1:14332;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;

        # The app already sets Cache-Control/ETag; let clients and any CDN honour it.
        proxy_pass_header ETag;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:14332/healthz;
        access_log off;
    }
}
