services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghstats-server:latest
    container_name: ghstats-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:14332:14330"
    volumes:
      - /srv/ghstats/data:/srv/ghstats/data:ro
    environment:
      GHSTATS_SERVER_SNAPSHOTPATH: /srv/ghstats/data/snapshot.json
      GHSTATS_SERVER_POLLINTERVALSECONDS: "30"
      GHSTATS_SERVER_RATELIMITPERMINUTE: "60"
      GHSTATS_SERVER_CACHEMAXAGESECONDS: "1800"
      GHSTATS_SERVER_DEFAULTTHEME: tokyonight
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:14330/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

