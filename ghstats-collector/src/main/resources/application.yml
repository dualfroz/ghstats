spring:
  main:
    banner-mode: off
  application:
    name: ghstats-collector

logging:
  level:
    root: INFO
    com.dualfroz.ghstats: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

ghstats:
  collector:
    owners:
      - dualfroz
      - VulCodeCom
      - aphrodipl
      - thelunaticstudios
      - Sinlege
    authorEmails:
      - me@dualfroz.com
      - me@dualfroz.com
      - 284081405+dualfroz@users.noreply.github.com
      - 37844753+FoksVHox@users.noreply.github.com
    fullCountRepos:
      - secret
    baselineCommits: 0
    languageDenylist:
      - JSON
      - JSON5
      - YAML
      - TOML
      - Markdown
      - Plain Text
      - Text
      - SVG
      - XML
      - INI
      - Dotenv
      - CSV
    languageAliases:
      Tsx: TypeScript
      Jsx: JavaScript
    reposRoot: /srv/ghstats/repos
    snapshotPath: /srv/ghstats/data/snapshot.json
    ghBin: gh
    gitBin: git
    tokeiBin: tokei
    cloneTimeoutSeconds: 600
    gitTimeoutSeconds: 120
    numstatTimeoutSeconds: 300
    tokeiTimeoutSeconds: 120
    enumerationTimeoutSeconds: 120
    calendarDays: 371
    topReposCount: 12
    repoListLimit: 1000
    identityLogin: dualfroz
    identityName: DualFroz
